name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate version source
        run: python scripts/sync_version.py
      - name: Static compile
        run: python -m compileall -q acoustic_acquisition.py acoustic_gui.py updater scripts tests
      - name: Unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
